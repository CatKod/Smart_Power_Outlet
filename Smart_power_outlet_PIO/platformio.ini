; ================================================================
; Smart Power Outlet - PlatformIO Project Configuration
; Hỗ trợ: ESP32-WROOM-32 và ESP32-P4
; ================================================================

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8

; ----------------------------------------------------------------
; ENV 1: ESP32-WROOM-32 (board phổ thông)
;   - WiFi onboard
;   - Reset button: GPIO 0 (BOOT, active LOW, có pull-up nội)
;   - Relay: GPIO 34
; ----------------------------------------------------------------
[env:esp32wroom]
platform = espressif32@^6.9.0
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_ESP32WROOM
    -D RELAY_GPIO=32
    -D RESET_BTN_GPIO=0
    -D DEBUG_MODE=0

; ----------------------------------------------------------------
; ENV 2: ESP32-P4 (cần ESP32-C6 như WiFi co-processor qua ESP-Hosted)
;   - Relay: GPIO 20
;   - Reset button: GPIO 35 (cần pull-up ngoài trên mạch)
;   NOTE: WiFi trên P4 qua C6 ESP-Hosted. Arduino WiFiManager
;         dùng native WiFi driver của Espressif, hoạt động khi
;         esp32 platform đã tích hợp hosted layer. Nếu gặp lỗi
;         WiFi, cần build với ESP-IDF framework riêng.
; ----------------------------------------------------------------
[env:esp32p4]
; pioarduino là fork của espressif32 platform có hỗ trợ ESP32-P4 (Arduino core 3.2+)
; Xem: https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_ESP32P4
    -D RELAY_GPIO=20
    -D RESET_BTN_GPIO=35
    -D DEBUG_MODE=0
; ----------------------------------------------------------------
; ENV 3: ESP8266
; Mapping GPIO tương ứng:
;   - Relay: GPIO 5 (D1 trên NodeMCU)
;   - Reset button: GPIO 0 (D3 trên NodeMCU, active LOW, có pull-up nội)
; ----------------------------------------------------------------
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_ESP8266
    -D RELAY_GPIO=5
    -D RESET_BTN_GPIO=0
    -D DEBUG_MODE=0

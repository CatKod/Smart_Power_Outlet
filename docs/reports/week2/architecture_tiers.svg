<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><defs><marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5A626E"/></marker></defs><rect width="1280" height="690" fill="#FFFFFF"/><text x="40" y="60" font-family="Arial" font-size="20" fill="#1F4E79" text-anchor="start" font-weight="bold">Smart Power Outlet — Phân tầng kiến trúc 3 thành phần</text><rect x="40" y="100" width="400" height="240" rx="8" ry="8" fill="#F7F8FA" stroke="#D5DAE1" stroke-width="1.5"/><text x="54" y="121" font-family="Arial" font-size="13" fill="#1B1F24" text-anchor="start" font-weight="bold">MÁY CHỦ GIÁM SÁT TRONG TỦ RACK</text><rect x="520" y="100" width="300" height="240" rx="8" ry="8" fill="#F7F8FA" stroke="#D5DAE1" stroke-width="1.5"/><text x="534" y="121" font-family="Arial" font-size="13" fill="#1B1F24" text-anchor="start" font-weight="bold">MÁY CHỦ WEB</text><rect x="900" y="100" width="340" height="240" rx="8" ry="8" fill="#F7F8FA" stroke="#D5DAE1" stroke-width="1.5"/><text x="914" y="121" font-family="Arial" font-size="13" fill="#1B1F24" text-anchor="start" font-weight="bold">VI ĐIỀU KHIỂN</text><rect x="80" y="400" width="320" height="150" rx="8" ry="8" fill="#F7F8FA" stroke="#D5DAE1" stroke-width="1.5"/><text x="94" y="421" font-family="Arial" font-size="13" fill="#1B1F24" text-anchor="start" font-weight="bold">THIẾT BỊ ĐO ĐIỆN</text><line x1="410" y1="230" x2="550" y2="230" stroke="#5A626E" stroke-width="1.8" marker-end="url(#arw)"/><text x="480" y="222" font-family="Arial" font-size="12" fill="#5A626E" text-anchor="middle">REST / HTTP</text><line x1="790" y1="230" x2="930" y2="230" stroke="#5A626E" stroke-width="1.8" marker-end="url(#arw)"/><text x="860" y="222" font-family="Arial" font-size="12" fill="#5A626E" text-anchor="middle">MQTT · WiFi</text><line x1="240" y1="310" x2="240" y2="440" stroke="#5A626E" stroke-width="1.8" marker-end="url(#arw)"/><text x="252" y="380" font-family="Arial" font-size="12" fill="#5A626E" text-anchor="start">USB-TTL · Modbus-RTU 9600 8N1</text><rect x="60" y="140" width="340" height="160" rx="10" ry="10" fill="#EEF4FF" stroke="#9DB8F2" stroke-width="1.8"/><text x="230" y="178.5" font-family="Arial" font-size="14" fill="#1B1F24" text-anchor="middle" font-weight="bold">1. ELECTRONIC PC AGENT</text><text x="230" y="197.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">Windows Service / systemd daemon</text><text x="230" y="216.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">headless · không GUI</text><text x="230" y="235.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">Modbus-RTU + COM auto-discovery</text><text x="230" y="254.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">SQLite WAL + REST API</text><rect x="550" y="175" width="240" height="110" rx="10" ry="10" fill="#EEF4FF" stroke="#9DB8F2" stroke-width="1.8"/><text x="670" y="207.5" font-family="Arial" font-size="14" fill="#1B1F24" text-anchor="middle" font-weight="bold">3. WEB SERVER</text><text x="670" y="226.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">giao diện web + API người dùng</text><text x="670" y="245.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">báo cáo · lịch sử sự cố</text><rect x="930" y="150" width="280" height="160" rx="10" ry="10" fill="#EEF4FF" stroke="#9DB8F2" stroke-width="1.8"/><text x="1070" y="188.5" font-family="Arial" font-size="14" fill="#1B1F24" text-anchor="middle" font-weight="bold">2. CENTRAL IoT CONTROLLER</text><text x="1070" y="207.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">ESP32-S3 N16R8 · ESP-IDF 5.5.3</text><text x="1070" y="226.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">WiFi · MQTT client</text><text x="1070" y="245.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">điều khiển relay</text><text x="1070" y="264.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">đo điện PZEM #2 (UART1)</text><rect x="110" y="440" width="260" height="90" rx="10" ry="10" fill="#F3EEFF" stroke="#B9A6F0" stroke-width="1.8"/><text x="240" y="462.5" font-family="Arial" font-size="14" fill="#1B1F24" text-anchor="middle" font-weight="bold">PZEM-004T V3.0</text><text x="240" y="481.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">đo 1 pha 220 V AC</text><text x="240" y="500.5" font-family="Arial" font-size="12" fill="#1B1F24" text-anchor="middle">Modbus-RTU slave 0x01</text><rect x="520" y="570" width="720" height="76" rx="8" ry="8" fill="#FFF9DB" stroke="#E9D58A" stroke-width="1.5"/><text x="536" y="600" font-family="Arial" font-size="13" fill="#1B1F24" text-anchor="start">Chỉ PC Agent giữ cổng COM (Windows: 1 tiến trình / 1 cổng). Web Server và</text><text x="536" y="620" font-family="Arial" font-size="13" fill="#1B1F24" text-anchor="start">ESP32 đọc dữ liệu qua REST/MQTT — không cắm serial trực tiếp.</text></svg>